<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Lab | Sufyan Ahmad</title>
<meta name="description" content="A hands-on DevOps lab by Sufyan Ahmad with working code, a visual story and a beginner study guide.">
<meta name="author" content="Sufyan Ahmad">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231b2838'/><text x='32' y='42' font-family='Arial' font-size='26' font-weight='700' fill='%239cc3f0' text-anchor='middle'>SA</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=20261007">
<link rel="stylesheet" href="assets/labs.css?v=20261007">
<link rel="stylesheet" href="assets/site.css?v=20261007">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<nav class="top site-nav" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="./"><span class="logo">SA</span><span class="name">Sufyan Ahmad</span></a>
    <div class="nlinks">
      <a href="./#experience" class="hide-sm">Experience</a>
      <a href="./#projects" class="hide-sm">Client projects</a>
      <a href="labs.html" class="on">Labs</a>
      <a href="./#contact" class="hire">Contact me</a>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch theme"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#moon"/></svg></button>
    </div>
  </div>
</nav>

<div id="app"><div class="wrap notfound"><p>Loading the lab…</p></div></div>

<footer class="foot">© <span id="year"></span> Sufyan Ahmad · DevOps Engineer · Herborn, Germany · <a href="labs.html">All labs</a> · <a href="./">Portfolio</a></footer>

<script src="assets/site.js?v=20261007"></script>
<script src="assets/labs.js?v=20261007"></script>
<script>
(async function () {
  const L = window.Labs, esc = L.esc, $ = s => document.querySelector(s);
  $("#year").textContent = new Date().getFullYear();
  const app = $("#app");
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug") || "";

  let items;
  try { items = await L.load(); }
  catch (e) { app.innerHTML = '<div class="wrap notfound"><h1>Could not load the lab</h1><p><a href="labs.html">See all labs</a></p></div>'; return; }
  const ordered = items.slice().sort((a, b) => a.number - b.number);
  const i = ordered.findIndex(p => p.slug === slug);
  const p = ordered[i];
  if (!p) {
    document.title = "Lab not found | Sufyan Ahmad";
    app.innerHTML = '<div class="wrap notfound"><div class="eyebrow">404</div><h1>This lab does not exist (yet)</h1><p><a class="btn primary" href="labs.html">Browse all labs</a></p></div>';
    return;
  }
  const prev = ordered[i - 1], next = ordered[i + 1];
  const name = p.simple_name || p.name;
  const slides = p.slides || [];
  document.title = `${name} | DevOps Lab ${L.pad(p.number)} | Sufyan Ahmad`;
  document.querySelector('meta[name="description"]').content = p.tagline || p.summary;
  const date = p.date ? new Date(p.date + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";

  const resources = [
    [p.repository, Site.icon("github", "lg"), "GitHub repository", "All the code, tests, CI and documentation", "primary"],
    [p.study, Site.icon("book-open", "lg"), "Study guide", "Chapter by chapter, written for complete beginners"],
    [p.study_pdf, Site.icon("file-text", "lg"), "Study guide as PDF", "The whole guide in one file to read offline"],
    [p.docs, Site.icon("layers", "lg"), "Architecture & design", "How it is built and why each decision was made"],
    [p.linkedin, Site.icon("linkedin", "lg"), "LinkedIn post", "The short story behind the lab"]
  ].filter(r => r[0]);

  const tabs = [["overview", "Overview"], slides.length && ["story", "Visual story"], ["learn", "What you'll learn"], ["hood", "Under the hood"], ["resources", "Resources"]].filter(Boolean);

  app.innerHTML = `
  <header class="lhero dhero ${L.lvClass(p.difficulty)}">
    <div class="wrap">
      <div class="dhero-text">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="labs.html">Labs</a><span>/</span><span>Lab ${L.pad(p.number)}</span></nav>
        <div class="dmeta"><span class="lvl-pill ${L.lvClass(p.difficulty)}"><i></i>${esc(p.difficulty)}</span><span class="mono">LAB ${L.pad(p.number)}</span>${date ? `<span>· ${esc(date)}</span>` : ""}</div>
        <h1>${esc(name)}</h1>
        ${p.simple_name ? `<p class="tech">${esc(p.name)}</p>` : ""}
        <p class="lead">${esc(p.tagline || p.summary)}</p>
        <div class="cta">
          ${slides.length ? `<a class="btn primary" href="#story">${Site.icon("play")}Watch the ${slides.length}-slide story</a>` : ""}
          <a class="btn ghost" href="${esc(p.repository)}" target="_blank" rel="noopener">Open on GitHub</a>
          ${p.study_pdf ? `<a class="btn ghost" href="${esc(p.study_pdf)}" target="_blank" rel="noopener">Study guide PDF</a>` : ""}
        </div>
      </div>
      <div class="dhero-media"><img src="${esc(p.image)}" alt="Architecture of ${esc(name)}"></div>
    </div>
  </header>

  <div class="wrap">
    <div class="dfacts">
      <div class="dfact ${L.lvClass(p.difficulty)}"><div class="k">Level</div><div class="v" style="color:var(--lv)">${esc(p.difficulty)}</div></div>
      <div class="dfact"><div class="k">Main tool</div><div class="v">${esc(p.primary)}</div></div>
      <div class="dfact"><div class="k">Lab type</div><div class="v">${esc(L.typeLabel(p.type))}</div></div>
      <div class="dfact"><div class="k">Tools used</div><div class="v">${L.tools(p).length} tools</div></div>
    </div>
  </div>

  <nav class="tabs" aria-label="Sections"><div class="wrap">${tabs.map(([id, t], k) => `<a href="#${id}" data-tab="${id}"${k ? "" : ' class="on"'}>${t}</a>`).join("")}</div></nav>

  <main class="wrap">
    <section class="dsec" id="overview">
      <div class="eyebrow">Overview</div>
      <h2>Why this lab exists</h2>
      <p class="sub">The idea in plain words, before any tool names.</p>
      <div class="why">
        <article class="w1"><div class="ic">${Site.icon("lightbulb", "lg")}</div><h3>What it does</h3><p>${esc(p.summary)}</p></article>
        <article class="w2"><div class="ic">${Site.icon("triangle-alert", "lg")}</div><h3>The problem</h3><p>${esc(p.problem)}</p></article>
        ${p.benefit ? `<article class="w3"><div class="ic">${Site.icon("circle-check", "lg")}</div><h3>Why it helps</h3><p>${esc(p.benefit)}</p></article>` : ""}
      </div>
    </section>

    ${slides.length ? `
    <section class="dsec" id="story">
      <div class="eyebrow">Visual story</div>
      <h2>The whole lab in ${slides.length} pictures</h2>
      <p class="sub">A quick visual walk-through: the problem, the idea, the architecture and the measured results.</p>
      <div class="story">
        <div class="stage" id="stage" tabindex="0" aria-roledescription="carousel" aria-label="Visual story slides">
          <button class="snav sprev" id="sPrev" aria-label="Previous slide">${Site.icon("chevron-left", "lg")}</button>
          <img id="sImg" alt="">
          <button class="snav snext" id="sNext" aria-label="Next slide">${Site.icon("chevron-right", "lg")}</button>
          <button class="sfull" id="sFull" aria-label="Full screen" title="Full screen">${Site.icon("maximize")}</button>
        </div>
        <div class="sside">
          <div><div class="scount" id="sCount" aria-live="polite"></div></div>
          <div class="sbar"><i id="sBar"></i></div>
          <h3>${esc(name)}</h3>
          <p>${esc(p.tagline || "")}</p>
          <div class="thumbs" id="thumbs">${slides.map((s, k) => `<button aria-label="Go to slide ${k + 1}"><img src="${esc(s)}" alt="" loading="lazy" decoding="async"></button>`).join("")}</div>
          <div class="shint">Use &larr; &rarr; keys, swipe, or click a thumbnail</div>
        </div>
      </div>
    </section>` : ""}

    <section class="dsec" id="learn">
      <div class="eyebrow">What you'll learn</div>
      <h2>Skills you take away</h2>
      <p class="sub">Practised hands-on in the labs, not just read about.</p>
      <ul class="learn">${(p.skills || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      <div class="tools-row">${L.tools(p).map((t, k) => `<span class="t${k ? "" : " main"}">${esc(t)}</span>`).join("")}</div>
    </section>

    <section class="dsec" id="hood">
      <div class="eyebrow">Under the hood</div>
      <h2>For engineers: how it is built</h2>
      <p class="sub">The technical details, for when you want to go deeper.</p>
      <div class="hood">
        ${p.engineering_problem ? `<details open><summary>${Site.icon("target")}The engineering challenge</summary><div class="body">${esc(p.engineering_problem)}</div></details>` : ""}
        ${p.architecture ? `<details open><summary>${Site.icon("layers")}Architecture</summary><div class="body">${esc(p.architecture)}</div></details>` : ""}
        ${p.unique_capability ? `<details><summary>${Site.icon("sparkles")}What makes it special</summary><div class="body">${esc(p.unique_capability)}</div></details>` : ""}
      </div>
    </section>

    <section class="dsec" id="resources">
      <div class="eyebrow">Resources</div>
      <h2>Start the lab</h2>
      <p class="sub">Everything is free and open source. Clone it, run it, break it, fix it.</p>
      <div class="res">${resources.map(([h, ic, t, d, cls]) => `<a ${cls ? `class="${cls}"` : ""} href="${esc(h)}" target="_blank" rel="noopener"><span class="ic">${ic}</span><span><b>${t}</b><small>${d}</small></span></a>`).join("")}</div>
    </section>

    <nav class="pn" aria-label="More labs">
      ${prev ? `<a class="prev" href="${L.href(prev)}"><small>&larr; Previous lab</small><b>${esc(prev.simple_name || prev.name)}</b></a>` : `<a class="prev" href="labs.html"><small>&larr; Back</small><b>All labs</b></a>`}
      ${next ? `<a class="next" href="${L.href(next)}"><small>Next lab &rarr;</small><b>${esc(next.simple_name || next.name)}</b></a>` : `<a class="next" href="labs.html"><small>That's the newest one &rarr;</small><b>Browse all labs</b></a>`}
    </nav>
  </main>`;

  /* active tab follows the scroll position */
  const tabLinks = [...document.querySelectorAll(".tabs a")];
  const secIO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) tabLinks.forEach(a => a.classList.toggle("on", a.dataset.tab === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  tabs.forEach(([id]) => secIO.observe(document.getElementById(id)));

  if (!slides.length) return;

  /* inline story player */
  const img = $("#sImg"), stage = $("#stage"), thumbs = [...document.querySelectorAll("#thumbs button")];
  let idx = 0, startX = null;
  function show(k, push = true) {
    idx = Math.max(0, Math.min(k, slides.length - 1));
    img.src = slides[idx];
    img.alt = `${name}: slide ${idx + 1} of ${slides.length}`;
    $("#sCount").textContent = `Slide ${idx + 1} / ${slides.length}`;
    $("#sBar").style.width = ((idx + 1) / slides.length * 100) + "%";
    thumbs.forEach((t, j) => { t.classList.toggle("on", j === idx); t.setAttribute("aria-current", j === idx ? "true" : "false"); });
    $("#sPrev").disabled = idx === 0;
    $("#sNext").disabled = idx === slides.length - 1;
    [idx + 1, idx - 1].forEach(j => { if (slides[j]) { const im = new Image(); im.src = slides[j]; } });
    if (push) {
      const q = new URLSearchParams(location.search); q.set("slide", idx + 1);
      history.replaceState(null, "", location.pathname + "?" + q + "#story");
    }
  }
  $("#sPrev").addEventListener("click", () => show(idx - 1));
  $("#sNext").addEventListener("click", () => show(idx + 1));
  thumbs.forEach((t, j) => t.addEventListener("click", () => show(j)));
  $("#sFull").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen?.().catch(() => {});
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select")) return;
    const r = stage.getBoundingClientRect();
    const visible = document.fullscreenElement === stage || (r.bottom > 80 && r.top < innerHeight - 80);
    if (!visible) return;
    if (e.key === "ArrowRight") { e.preventDefault(); show(idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(idx - 1); }
  });
  img.addEventListener("pointerdown", e => { startX = e.clientX; });
  img.addEventListener("pointerup", e => {
    if (startX === null) return;
    const dx = e.clientX - startX; startX = null;
    if (Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1));
    else if (e.pointerType === "mouse") show(idx + 1);
  });
  const start = (parseInt(params.get("slide") || "1", 10) || 1) - 1;
  show(start, params.has("slide"));
  if (params.has("slide") || location.hash === "#story") document.getElementById("story").scrollIntoView();
})();
</script>
</body>
</html>
